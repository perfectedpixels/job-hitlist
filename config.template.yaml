# Job hitlist configuration. Generated by setup.py; edit freely afterwards.
alerts:
  enabled: __ALERTS__    # read Jobright/Ladders/CareerBuilder alert mail from Apple Mail

searches:
  keywords: __KEYWORDS__
  locations: __LOCATIONS__
  remote_us: __REMOTE__
  # r86400 = past 24h, r604800 = past week, r2592000 = past month
  time_window: r604800
  pages_per_search: 2          # 25 cards per page from the guest endpoint

# Title tiers per track, matched case-insensitively against the job title.
# director -- Jason, 13 Sep 2026: "director, senior director, senior manager
#   are the strongest fits, with vp for smaller businesses."
# ic -- Jason, 16 Sep 2026, after a recruiter said principal roles are the
#   hard ones to fill: "principal designer, sr. principal, and sr. staff".
tracks: __TRACKS__

# The title must look like a design/UX role...
design_signal: '__DESIGN_SIGNAL__' #'\b(product design|ux|user experience|experience design|design)\b'
# ...and must not be one of these neighbouring disciplines.
design_exclude: '__DESIGN_EXCLUDE__'

locations:
  # +20 if the job location matches. Seattle, LA, OC, SD per resume.yaml.
  target: '__TARGET_RE__'
  target_score: 20
  remote_score: 15           # location or title literally says remote
  remote_filter_score: 6     # only LinkedIn's remote filter says so; office city shown
  # Anything else is excluded unless the posting is remote.
  other_score: -100

recency:                       # days since posted -> bonus. Steep on purpose.
  - { max_days: 1,  score: 25 }
  - { max_days: 3,  score: 18 }
  - { max_days: 7,  score: 8 }
  - { max_days: 14, score: -8 }
  - { max_days: 999, score: -25 }
few_applicants_score: 8        # "Be among the first 25 applicants"

ai_signal: '\b(ai|artificial intelligence|agentic|agents?|llms?|machine learning|generative|copilot|conversational)\b'
ai_score: 15                   # awarded when the description hits ai_signal 2+ times
keywords_bonus:
  - { pattern: '\bdesign system', score: 5 }
  - { pattern: '\b(user research|ux research)', score: 3 }
  - { pattern: '\b(b2b|enterprise|saas)\b', score: 3 }

# Staffing agencies and aggregators repost other companies' roles. Kept, but
# down-weighted and tagged, as the real employer is usually in the title.
agency_pattern: '\b(jobot|jobgether|jack & jill|jack and jill|ladders|careerbuilder|robert half|aquent|creative circle|24 seven|vaco|randstad|kforce|insight global|apex systems|tek ?systems|cybercoders|motion recruitment|adecco|hays|michael page|the mom project|toptal|braintrust)\b'
agency_score: -15

bands:
  strong: 120
  good: 100
  show_min: 80                 # rows under this are kept in data but not rendered

fetch:
  delay_seconds: 2.5
  detail_min_tier_score: 40    # only fetch the full page for titles that clear a tier
